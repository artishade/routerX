{# Backup receipt dialog — port of the Backup Receipt Dialog in StorageTab.tsx.
   Context: receipt = {ok, file_name, size_bytes, provider, message} #}
<dialog id="st-receipt-dialog" aria-label="Backup created"
  class="h-fit w-[calc(100%-2rem)] max-w-sm nx-panel p-6 text-slate-200 shadow-2xl backdrop:bg-black/70">
  <h3 class="flex items-center gap-2 text-base font-semibold text-slate-100">
    <i data-lucide="check-circle-2" class="size-5 text-emerald-400"></i>Backup created
  </h3>
  <p class="mt-1 text-sm leading-relaxed text-slate-500">{{ receipt.message }}</p>

  <div class="mt-4 space-y-2 rounded-lg border border-slate-800 bg-[#0a0a0a] p-3 font-mono text-xs">
    <div class="flex items-center justify-between gap-4">
      <span class="text-slate-500">file</span>
      <span class="truncate text-emerald-300">{{ receipt.file_name }}</span>
    </div>
    <div class="flex items-center justify-between gap-4">
      <span class="text-slate-500">size</span>
      <span class="text-slate-300">{{ receipt.size_bytes | fmt_bytes }}</span>
    </div>
    <div class="flex items-center justify-between gap-4">
      <span class="text-slate-500">provider</span>
      <span class="text-slate-300">{{ receipt.provider }}</span>
    </div>
  </div>

  <div class="mt-6 flex justify-end">
    <button type="button" onclick="document.getElementById('st-receipt-dialog') && document.getElementById('st-receipt-dialog').close()"
      class="inline-flex h-9 items-center rounded-md bg-emerald-500 px-4 text-sm font-medium text-white transition-colors hover:bg-emerald-400">
      Done
    </button>
  </div>
</dialog>
<script>
  (function () {
    var d = document.getElementById('st-receipt-dialog');
    if (d && !d.open) d.showModal();
  })();
</script>

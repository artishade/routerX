{# Model detail error dialog — swapped into #models-detail-slot when a card's
   model can no longer be resolved (stale id / invalid id). Auto-shows. #}
<dialog id="nm-error-dialog" aria-labelledby="nm-error-title"
  class="w-[min(92vw,24rem)] nx-panel p-0 text-slate-200">
  <div class="p-5">
    <div class="flex items-start gap-2.5">
      <i data-lucide="triangle-alert" class="mt-0.5 size-4 shrink-0 text-amber-300"></i>
      <div class="min-w-0">
        <h3 id="nm-error-title" class="text-sm font-semibold text-slate-100">Model unavailable</h3>
        <p class="mt-1 text-xs text-slate-400">{{ message }}</p>
      </div>
    </div>
    <div class="mt-4 flex justify-end">
      <button type="button" data-close-dialog
        class="h-8 rounded border border-slate-700 px-2.5 text-xs text-slate-300 hover:bg-slate-800">Close</button>
    </div>
  </div>
</dialog>
<script>
  (function () {
    var d = document.getElementById('nm-error-dialog');
    if (d && d.showModal) d.showModal();
    if (window.lucide) window.lucide.createIcons();
  })();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="RouterX architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#404040"/>
    </marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/><stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="780" fill="#080c14"/>
  <text x="32" y="46" fill="#e2e8f0" font-size="24" font-weight="700">RouterX — architecture</text>
  <text x="32" y="70" fill="#64748b" font-size="13">One FastAPI process serves the gateway API, the dashboard, and (optionally) a separately hosted terminal.</text>

  <!-- Clients -->
  <g>
    <rect x="32" y="92" width="936" height="72" rx="10" fill="#0d1322" stroke="#1e293b"/>
    <text x="48" y="118" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">CLIENTS</text>
    <rect x="150" y="104" width="180" height="46" rx="8" fill="#0b1220" stroke="#1f2937"/>
    <text x="240" y="132" fill="#cbd5e1" font-size="13" text-anchor="middle">OpenAI SDKs / apps</text>
    <rect x="346" y="104" width="200" height="46" rx="8" fill="#0b1220" stroke="#1f2937"/>
    <text x="446" y="127" fill="#cbd5e1" font-size="13" text-anchor="middle">Claude Code / Desktop</text>
    <text x="446" y="143" fill="#64748b" font-size="11" text-anchor="middle">ANTHROPIC_BASE_URL=…/v1</text>
    <rect x="562" y="104" width="180" height="46" rx="8" fill="#0b1220" stroke="#1f2937"/>
    <text x="652" y="132" fill="#cbd5e1" font-size="13" text-anchor="middle">Dashboard (Jinja+HTMX)</text>
    <rect x="758" y="104" width="180" height="46" rx="8" fill="#0b1220" stroke="#1f2937"/>
    <text x="848" y="132" fill="#cbd5e1" font-size="13" text-anchor="middle">curl / your product</text>
  <line x1="500" y1="164" x2="500" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Gateway -->
  <rect x="32" y="200" width="936" height="104" rx="10" fill="url(#hero)" stroke="#065f46"/>
  <text x="48" y="226" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1.5">ROUTERX GATEWAY</text>
  <text x="48" y="252" fill="#e2e8f0" font-size="15" font-weight="700">FastAPI · main.py · routers/gateway.py</text>
  <text x="48" y="274" fill="#94a3b8" font-size="12" font-family="ui-monospace,Menlo,monospace">/v1/chat/completions · /v1/messages · /v1/messages/count_tokens · /v1/models · /v1/embeddings</text>
  <text x="48" y="292" fill="#64748b" font-size="12">streaming SSE + non-streaming · identity spoofing (response.model = requested) · _nova metadata · RequestLog</text>
  <line x1="500" y1="304" x2="500" y2="336" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Routing brain -->
  <g>
    <rect x="32" y="340" width="936" height="118" rx="10" fill="#0d1322" stroke="#1e293b"/>
    <text x="48" y="366" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1.5">ROUTING BRAIN — nova/routing.py</text>
    <g font-size="11.5" fill="#cbd5e1">
      <rect x="48" y="378" width="150" height="34" rx="7" fill="#0b1220" stroke="#1f2937"/><text x="123" y="399" text-anchor="middle">policy engine</text>
      <rect x="206" y="378" width="150" height="34" rx="7" fill="#0b1220" stroke="#1f2937"/><text x="281" y="399" text-anchor="middle">exposure lists</text>
      <rect x="364" y="378" width="150" height="34" rx="7" fill="#0b1220" stroke="#1f2937"/><text x="439" y="399" text-anchor="middle">tag routing</text>
      <rect x="522" y="378" width="170" height="34" rx="7" fill="#0b1220" stroke="#1f2937"/><text x="607" y="399" text-anchor="middle">(provider,model) lockouts</text>
      <rect x="700" y="378" width="150" height="34" rx="7" fill="#0b1220" stroke="#1f2937"/><text x="775" y="399" text-anchor="middle">selection strategy</text>
      <rect x="858" y="378" width="94" height="34" rx="7" fill="#0b1220" stroke="#1f2937"/><text x="905" y="399" text-anchor="middle">scores</text>
    </g>
    <text x="48" y="440" fill="#fbbf24" font-size="12.5" font-weight="700">Fallback chain:</text>
    <text x="150" y="440" fill="#cbd5e1" font-size="12.5">1) direct model  →  2) explicit route chain  →  3) AUTO STAND-INS (every other healthy, enabled provider)  →  4) free engine</text>
  </g>
  <line x1="300" y1="458" x2="300" y2="494" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="458" x2="700" y2="494" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Upstream + engine -->
  <rect x="32" y="498" width="470" height="118" rx="10" fill="#0d1322" stroke="#1e293b"/>
  <text x="48" y="524" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.5">UPSTREAMS (pooled httpx, 600s read)</text>
  <text x="48" y="550" fill="#cbd5e1" font-size="12.5">OpenAI-compatible · Anthropic-native · Gemini</text>
  <text x="48" y="572" fill="#cbd5e1" font-size="12.5">Cloudflare Worker · custom gateway · xAI Grok</text>
  <text x="48" y="596" fill="#64748b" font-size="11.5">one key pool per provider · cooldowns · retries across the whole chain</text>

  <rect x="500" y="498" width="468" height="118" rx="10" fill="#0d1322" stroke="#1e293b"/>
  <text x="516" y="524" fill="#fca5a5" font-size="12" font-weight="700" letter-spacing="1.5">ROUTERX FREE ENGINE (sidecar, JS)</text>
  <text x="516" y="550" fill="#cbd5e1" font-size="12.5">Zero-key free route: RouterX free catalogue</text>
  <text x="516" y="572" fill="#cbd5e1" font-size="12.5">chat · search · page reader · model list</text>
  <text x="516" y="596" fill="#64748b" font-size="11.5">final stage — degrades honestly if unreachable</text>
  <line x1="500" y1="616" x2="500" y2="650" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Persistence -->
  <rect x="32" y="654" width="640" height="96" rx="10" fill="#0d1322" stroke="#1e293b"/>
  <text x="48" y="680" fill="#a7f3d0" font-size="12" font-weight="700" letter-spacing="1.5">STATE — SQLAlchemy 2 (SQLite or Postgres, additive bootstrap)</text>
  <text x="48" y="706" fill="#cbd5e1" font-size="12.5" font-family="ui-monospace,Menlo,monospace">Provider · Model · ProviderKey · ModelRoute · RequestLog · SystemConfig</text>
  <text x="48" y="728" fill="#64748b" font-size="11.5">nothing is ever deleted or reset by a deploy — new columns/tables are added only</text>

  <rect x="690" y="654" width="278" height="96" rx="10" fill="#0d1322" stroke="#312e81"/>
  <text x="706" y="680" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1.5">TERMINAL (hostable alone)</text>
  <text x="706" y="703" fill="#cbd5e1" font-size="12">pty shells · sandbox exec · web console</text>
  <text x="706" y="723" fill="#cbd5e1" font-size="12">Agentbox — the AI agent, /agent/*</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="RouterX auto-fallback demo">
  <title>RouterX auto-fallback: a failed provider rolls onto the next healthy provider, then the free engine.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#404040"/></marker>
    <path id="flow" d="M120 210 L360 210 L600 210 L840 210"/>
  </defs>
  <rect width="1000" height="400" fill="#080c14"/>
  <text x="32" y="48" fill="#e2e8f0" font-size="22" font-weight="700">Auto-fallback in action</text>
  <text x="32" y="72" fill="#64748b" font-size="13">A request keeps its id, but an upstream failure never reaches your client — the pool absorbs it.</text>

  <rect x="40" y="150" width="160" height="120" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="120" y="182" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="700">Client</text>
  <text x="120" y="206" fill="#6ee7b7" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">model: gpt-4o</text>
  <text x="120" y="228" fill="#64748b" font-size="10.5" text-anchor="middle">OpenAI / Claude SDK</text>

  <rect x="240" y="150" width="200" height="120" rx="12" fill="#0d1322" stroke="#7f1d1d"/>
  <circle cx="264" cy="176" r="6" fill="#fb7185"><animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></circle>
  <text x="280" y="181" fill="#cbd5e1" font-size="13" font-weight="700">openai-main</text>
  <text x="264" y="208" fill="#fb7185" font-size="12" font-family="ui-monospace,Menlo,monospace">429 rate limited</text>
  <text x="264" y="232" fill="#64748b" font-size="10.5">direct stage · failed</text>

  <rect x="500" y="150" width="200" height="120" rx="12" fill="#0d1322" stroke="#047857"/>
  <circle cx="524" cy="176" r="6" fill="#34d399"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/></circle>
  <text x="540" y="181" fill="#cbd5e1" font-size="13" font-weight="700">groq (stand-in)</text>
  <text x="524" y="208" fill="#34d399" font-size="12" font-family="ui-monospace,Menlo,monospace">200 OK · 1.2s</text>
  <text x="524" y="232" fill="#64748b" font-size="10.5">auto stage · served</text>

  <rect x="760" y="150" width="200" height="120" rx="12" fill="#0d1322" stroke="#312e81"/>
  <circle cx="784" cy="176" r="6" fill="#a78bfa"/>
  <text x="800" y="181" fill="#cbd5e1" font-size="13" font-weight="700">free engine</text>
  <text x="784" y="208" fill="#a78bfa" font-size="12" font-family="ui-monospace,Menlo,monospace">last resort</text>
  <text x="784" y="232" fill="#64748b" font-size="10.5">only if the pool is dry</text>

  <line x1="200" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="210" x2="500" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="210" x2="760" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <circle r="7" fill="#fbbf24">
    <animateMotion dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion>
  </circle>

  <text x="32" y="330" fill="#94a3b8" font-size="12.5">Fallback order:</text>
  <text x="150" y="330" fill="#cbd5e1" font-size="12.5" font-family="ui-monospace,Menlo,monospace">1 direct → 2 explicit chain → 3 auto stand-ins (every other healthy provider) → 4 free engine</text>
  <rect x="32" y="348" width="470" height="30" rx="7" fill="#0b1220" stroke="#1e293b"/>
  <text x="46" y="368" fill="#6ee7b7" font-size="11.5" font-family="ui-monospace,Menlo,monospace">_nova: { fallback: true, stage: 3, provider: "groq" }</text>
  <rect x="516" y="348" width="300" height="30" rx="7" fill="#0b1220" stroke="#1e293b"/>
  <text x="530" y="368" fill="#94a3b8" font-size="11.5" font-family="ui-monospace,Menlo,monospace">client still sees: model = "gpt-4o"</text>
</svg>

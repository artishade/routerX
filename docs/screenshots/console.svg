<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="RouterX console">
  <rect width="1200" height="720" fill="#080c14"/>
  <rect x="0" y="0" width="236" height="720" fill="#0b1220"/><line x1="236" y1="0" x2="236" y2="720" stroke="#1e293b"/>
  <circle cx="36" cy="42" r="12" fill="#34d399"/><text x="60" y="48" fill="#e2e8f0" font-size="17" font-weight="700">RouterX</text>
  <g font-size="13.5" fill="#94a3b8">
    <text x="40" y="122">Overview</text>
    <rect x="16" y="136" width="204" height="34" rx="7" fill="#064e3b"/><text x="40" y="158" fill="#6ee7b7" font-weight="600">Console</text>
    <text x="40" y="202">Terminal</text><text x="40" y="234">Providers</text><text x="40" y="266">Models</text><text x="40" y="298">Routes</text>
    <text x="40" y="330">Keys</text><text x="40" y="362">Storage</text><text x="40" y="394">Analytics</text><text x="40" y="426">Logs</text>
  </g>
  <text x="270" y="46" fill="#e2e8f0" font-size="20" font-weight="700">RouterX Console</text>
  <text x="270" y="68" fill="#64748b" font-size="12.5">One chatbox: ask a question · <tspan fill="#34d399" font-family="ui-monospace,Menlo,monospace">$ cmd</tspan> runs a shell · <tspan fill="#fbbf24" font-family="ui-monospace,Menlo,monospace">! task</tspan> delegates to the agent.</text>
  <rect x="1046" y="30" width="124" height="30" rx="7" fill="#0b1220" stroke="#1e293b"/><text x="1108" y="50" fill="#cbd5e1" font-size="12" text-anchor="middle">model: auto</text>
  <rect x="270" y="92" width="900" height="548" rx="10" fill="#0d1322" stroke="#1e293b"/>

  <!-- user msg -->
  <rect x="820" y="116" width="330" height="48" rx="10" fill="#064e3b"/>
  <text x="838" y="145" fill="#d1fae5" font-size="12.5">Why did gpt-4o fall back earlier?</text>

  <!-- assistant msg -->
  <rect x="292" y="182" width="700" height="150" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="310" y="208" fill="#94a3b8" font-size="12.5">The direct upstream returned 429, so the router walked on:</text>
  <g font-size="11.5" font-family="ui-monospace,Menlo,monospace">
    <text x="310" y="236" fill="#fb7185">1  openai/gpt-4o</text><text x="520" y="236" fill="#fb7185">429 rate limited</text>
    <text x="310" y="258" fill="#fbbf24">2  auto stand-in · groq/llama-3.3-70b</text><text x="640" y="258" fill="#34d399">200 · 1.2s</text>
  </g>
  <text x="310" y="288" fill="#64748b" font-size="11.5">Response model stayed “gpt-4o” (identity spoofing); the truth is in _nova.fallback.</text>
  <rect x="310" y="300" width="230" height="22" rx="6" fill="#1e1b4b"/><text x="322" y="316" fill="#c4b5fd" font-size="10.5" font-family="ui-monospace,Menlo,monospace">fallback: true · stage 2</text>

  <!-- tool/terminal msg -->
  <rect x="820" y="348" width="330" height="44" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="838" y="375" fill="#34d399" font-size="12.5" font-family="ui-monospace,Menlo,monospace">$ free -m</text>
  <rect x="292" y="404" width="700" height="120" rx="10" fill="#05080f" stroke="#1e293b"/>
  <g font-size="11.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace">
    <text x="310" y="430">               total        used        free      shared  buff/cache</text>
    <text x="310" y="452">Mem:           15872        4120        6022         210        5729</text>
    <text x="310" y="474">Swap:           2047           0        2047</text>
    <text x="310" y="500" fill="#34d399">exit 0 · 12ms · sandbox executor</text>
  </g>

  <!-- agent msg -->
  <rect x="820" y="540" width="330" height="44" rx="10" fill="#3b2f00"/>
  <text x="838" y="567" fill="#fde68a" font-size="12.5">! audit storage and report failures</text>
  <rect x="292" y="556" width="700" height="60" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="310" y="580" fill="#c4b5fd" font-size="12" font-weight="700">Agent · step 2/4</text>
  <text x="310" y="602" fill="#94a3b8" font-size="11.5" font-family="ui-monospace,Menlo,monospace">storage scan → 3 targets ok, 1 missing credentials…</text>

  <!-- composer -->
  <rect x="270" y="654" width="900" height="42" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="292" y="680" fill="#475569" font-size="12.5">Ask anything, or prefix with $ for a shell command, ! for an agent task…</text>
  <rect x="1090" y="662" width="66" height="26" rx="6" fill="#10b981"/><text x="1123" y="679" fill="#052e16" font-size="12" font-weight="700" text-anchor="middle">Send</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="RouterX dashboard overview">
  <rect width="1200" height="720" fill="#080c14"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="236" height="720" fill="#0b1220"/>
  <line x1="236" y1="0" x2="236" y2="720" stroke="#1e293b"/>
  <circle cx="36" cy="42" r="12" fill="#34d399"/><text x="60" y="48" fill="#e2e8f0" font-size="17" font-weight="700">RouterX</text>
  <text x="28" y="86" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.5">GATEWAY</text>
  <g font-size="13.5" fill="#94a3b8">
    <rect x="16" y="100" width="204" height="34" rx="7" fill="#064e3b"/>
    <text x="40" y="122" fill="#6ee7b7" font-weight="600">Overview</text>
    <text x="40" y="164">Console</text>
    <text x="40" y="196">Terminal</text>
    <text x="40" y="228">Providers</text>
    <text x="40" y="260">Models</text>
    <text x="40" y="292">Routes</text>
    <text x="40" y="324">Keys</text>
    <text x="40" y="356">Storage</text>
    <text x="40" y="388">Analytics</text>
    <text x="40" y="420">Logs</text>
  </g>
  <line x1="16" y1="452" x2="220" y2="452" stroke="#1e293b"/>
  <text x="28" y="478" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.5">BASE URL</text>
  <rect x="16" y="490" width="204" height="30" rx="6" fill="#070b13" stroke="#1e293b"/>
  <text x="26" y="510" fill="#34d399" font-size="11" font-family="ui-monospace,Menlo,monospace">https://your-host/v1</text>

  <!-- top bar -->
  <text x="270" y="46" fill="#e2e8f0" font-size="20" font-weight="700">Overview</text>
  <text x="270" y="68" fill="#64748b" font-size="12.5">Live gateway health, traffic and fallback activity.</text>
  <rect x="1010" y="30" width="160" height="32" rx="7" fill="#0b1220" stroke="#1e293b"/>
  <circle cx="1030" cy="46" r="5" fill="#34d399"/><text x="1044" y="50" fill="#cbd5e1" font-size="12">Auto-refresh on</text>

  <!-- KPI cards -->
  <g>
    <rect x="270" y="92" width="278" height="104" rx="10" fill="#0d1322" stroke="#1e293b"/>
    <text x="290" y="122" fill="#64748b" font-size="12">Requests · 24h</text>
    <text x="290" y="162" fill="#e2e8f0" font-size="34" font-weight="700">12,480</text>
    <text x="290" y="184" fill="#34d399" font-size="12">+18.2% vs previous</text>
    <rect x="562" y="92" width="278" height="104" rx="10" fill="#0d1322" stroke="#1e293b"/>
    <text x="582" y="122" fill="#64748b" font-size="12">Success rate</text>
    <text x="582" y="162" fill="#e2e8f0" font-size="34" font-weight="700">99.4%</text>
    <text x="582" y="184" fill="#34d399" font-size="12">fallback covered 61 failures</text>
    <rect x="854" y="92" width="316" height="104" rx="10" fill="#0d1322" stroke="#1e293b"/>
    <text x="874" y="122" fill="#64748b" font-size="12">Avg latency (p50 / p99)</text>
    <text x="874" y="162" fill="#e2e8f0" font-size="34" font-weight="700">412 / 1.9k</text>
    <text x="874" y="184" fill="#fbbf24" font-size="12">ms · engine last resort used 3×</text>
  </g>
  <rect x="270" y="216" width="546" height="286" rx="10" fill="#0d1322" stroke="#1e293b"/>
  <text x="290" y="246" fill="#e2e8f0" font-size="14" font-weight="700">Provider health</text>
  <g font-size="12.5">
    <circle cx="298" cy="282" r="5" fill="#34d399"/><text x="314" y="287" fill="#cbd5e1">anthropic-main</text><text x="560" y="287" fill="#64748b">7 models</text><text x="700" y="287" fill="#34d399" text-anchor="end" dx="90">healthy</text>
    <line x1="290" y1="304" x2="796" y2="304" stroke="#111827"/>
    <circle cx="298" cy="330" r="5" fill="#34d399"/><text x="314" y="335" fill="#cbd5e1">groq</text><text x="560" y="335" fill="#64748b">9 models</text><text x="790" y="335" fill="#34d399" text-anchor="end">healthy</text>
    <line x1="290" y1="352" x2="796" y2="352" stroke="#111827"/>
    <circle cx="298" cy="378" r="5" fill="#fbbf24"/><text x="314" y="383" fill="#cbd5e1">openrouter</text><text x="560" y="383" fill="#64748b">58 models</text><text x="790" y="383" fill="#fbbf24" text-anchor="end">cooling</text>
    <line x1="290" y1="400" x2="796" y2="400" stroke="#111827"/>
    <circle cx="298" cy="426" r="5" fill="#fb7185"/><text x="314" y="431" fill="#cbd5e1">worker-edge</text><text x="560" y="431" fill="#64748b">4 models</text><text x="790" y="431" fill="#fb7185" text-anchor="end">rate-limited</text>
    <line x1="290" y1="448" x2="796" y2="448" stroke="#111827"/>
    <circle cx="298" cy="474" r="5" fill="#a78bfa"/><text x="314" y="479" fill="#cbd5e1">RouterX Free engine</text><text x="560" y="479" fill="#64748b">free catalogue</text><text x="790" y="479" fill="#a78bfa" text-anchor="end">last resort</text>
  </g>
  <!-- Recent activity -->
  <rect x="832" y="216" width="338" height="286" rx="10" fill="#0d1322" stroke="#1e293b"/>
  <text x="852" y="246" fill="#e2e8f0" font-size="14" font-weight="700">Recent activity</text>
  <g font-size="11.5" font-family="ui-monospace,Menlo,monospace">
    <text x="852" y="280" fill="#94a3b8">claude-3-5-sonnet</text><text x="1150" y="280" fill="#34d399" text-anchor="end">200 · 640ms</text>
    <text x="852" y="306" fill="#64748b" font-size="10.5">stage 1 · anthropic-main</text>
    <line x1="852" y1="322" x2="1150" y2="322" stroke="#111827"/>
    <text x="852" y="348" fill="#94a3b8">gpt-4o</text><text x="1150" y="348" fill="#fbbf24" text-anchor="end">200 · 1.2s</text>
    <text x="852" y="374" fill="#64748b" font-size="10.5">fallback · auto stand-in groq</text>
    <line x1="852" y1="390" x2="1150" y2="390" stroke="#111827"/>
    <text x="852" y="416" fill="#94a3b8">nova/air</text><text x="1150" y="416" fill="#34d399" text-anchor="end">200 · 380ms</text>
    <text x="852" y="442" fill="#64748b" font-size="10.5">free engine</text>
    <line x1="852" y1="458" x2="1150" y2="458" stroke="#111827"/>
    <text x="852" y="484" fill="#94a3b8">gemini-2.5-pro</text><text x="1150" y="484" fill="#fb7185" text-anchor="end">429 · 90ms</text>
  </g>
  <!-- footer -->
  <rect x="270" y="520" width="900" height="168" rx="10" fill="#0d1322" stroke="#1e293b"/>
  <text x="290" y="550" fill="#e2e8f0" font-size="14" font-weight="700">Requests over 24h</text>
  <g fill="#34d399" opacity="0.85">
    <rect x="300" y="620" width="22" height="40" rx="3"/><rect x="336" y="600" width="22" height="60" rx="3"/><rect x="372" y="634" width="22" height="26" rx="3"/>
    <rect x="408" y="586" width="22" height="74" rx="3"/><rect x="444" y="612" width="22" height="48" rx="3"/><rect x="480" y="596" width="22" height="64" rx="3"/>
    <rect x="516" y="574" width="22" height="86" rx="3"/><rect x="552" y="606" width="22" height="54" rx="3"/><rect x="588" y="628" width="22" height="32" rx="3"/>
    <rect x="624" y="590" width="22" height="70" rx="3"/><rect x="660" y="566" width="22" height="94" rx="3"/><rect x="696" y="600" width="22" height="60" rx="3"/>
    <rect x="732" y="578" width="22" height="82" rx="3"/><rect x="768" y="614" width="22" height="46" rx="3"/><rect x="804" y="592" width="22" height="68" rx="3"/>
    <rect x="840" y="570" width="22" height="90" rx="3"/><rect x="876" y="604" width="22" height="56" rx="3"/><rect x="912" y="584" width="22" height="76" rx="3"/>
    <rect x="948" y="562" width="22" height="98" rx="3"/><rect x="984" y="598" width="22" height="62" rx="3"/><rect x="1020" y="620" width="22" height="40" rx="3"/>
    <rect x="1056" y="590" width="22" height="70" rx="3"/><rect x="1092" y="610" width="22" height="50" rx="3"/><rect x="1128" y="598" width="22" height="62" rx="3"/>
  </g>
